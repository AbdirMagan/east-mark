name: iOS TestFlight

# Builds a signed iOS app and uploads it to TestFlight, from Windows.
#
# The app is developed on a machine with no Xcode, so signing happens here on
# a macOS runner. Nothing secret lives in the repository: the credentials come
# from GitHub secrets at run time and the key file is written outside the
# checkout, into a directory the runner throws away.
#
# This is deliberately manual (workflow_dispatch). Every upload consumes a
# build number and notifies testers, so it should be something you decide to
# do rather than something a push does to you.
#
# ---------------------------------------------------------------------------
# What you need, once
# ---------------------------------------------------------------------------
#
#  1. An Apple Developer Program membership (99 USD/year).
#
#  2. An App Store Connect API key, which replaces an Apple ID and its
#     two-factor prompt -- a CI job cannot type a six-digit code.
#     App Store Connect > Users and Access > Integrations > App Store Connect
#     API > Team Keys > generate one with the "App Manager" role. You can
#     download the .p8 file exactly once.
#
#  3. An app record whose bundle ID is com.eastmarket.app. The signing
#     certificate and provisioning profile are created for you by
#     -allowProvisioningUpdates below, but the app record itself is not: an
#     upload for a bundle ID App Store Connect has never heard of is refused.
#
#  4. These four repository secrets
#     (Settings > Secrets and variables > Actions):
#
#       APPSTORE_KEY_ID       the key's ID, e.g. 2X9R4HXF34
#       APPSTORE_ISSUER_ID    the issuer UUID shown above the key list
#       APPSTORE_PRIVATE_KEY  the whole .p8 file, including the BEGIN and
#                             END lines, pasted as-is
#       APPLE_TEAM_ID         your ten-character team ID, from
#                             developer.apple.com > Membership
#
# Then: Actions > iOS TestFlight > Run workflow. The build appears in
# TestFlight after Apple finishes processing it, usually in 5-15 minutes.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What testers should know about this build
        required: false
        default: ''

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials are present
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Fail here with a sentence someone can act on, rather than twenty
          # minutes later inside xcodebuild with a code-signing error.
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See the comment at the top of .github/workflows/ios-testflight.yml."
            exit 1
          fi
          echo "All four secrets are set."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # altool looks for the key in this exact location and filename.
          # It sits in the home directory, not the checkout, so it cannot be
          # picked up by anything that archives the working tree.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Generate the Xcode project
        working-directory: ios
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://east-market-api-two.vercel.app/api/v1' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_3Ztr2sVd65gK5Y430CVUMw_Zw5dcXSx' }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # TestFlight rejects a build number it has already seen. The run
          # number never repeats and always increases, which is all Apple asks.
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Archive, signed
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          # -allowProvisioningUpdates lets Xcode create the signing certificate
          # and the provisioning profile through the API key, so no .p12 or
          # .mobileprovision has to be kept in a secret and rotated by hand.
          xcodebuild \
            -project EastMarket.xcodeproj \
            -scheme EastMarket \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/EastMarket.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      - name: Export the .ipa
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/EastMarket.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -lh build/export

      - name: Keep the signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "The export produced no .ipa"; exit 1; }
          # Validate first. A rejection here costs nothing; the same rejection
          # after an upload costs a build number you cannot reuse.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded. Apple takes a few minutes to process it before it shows in TestFlight."

      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
