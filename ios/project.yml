# XcodeGen spec: `brew install xcodegen && xcodegen generate` in this folder
# produces EastMarket.xcodeproj. Keeping the project as a text file means the
# app is reviewable in git, unlike a checked-in .pbxproj.
name: EastMarket
options:
  bundleIdPrefix: com.eastmarket
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # XcodeGen 2.46+ writes Xcode 16 project files by default, which the Xcode 15
  # on the macos-14 CI runner refuses to open ("future Xcode project file
  # format (77)"). Newer Xcode opens this format fine.
  projectFormat: xcode15_0
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Empty on a simulator build, which needs no signing. CI fills it from the
    # DEVELOPMENT_TEAM secret when it builds something destined for a device,
    # and on a Mac you set it in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  EastMarket:
    type: application
    platform: iOS
    sources:
      - path: EastMarket
    info:
      path: EastMarket/Resources/Info.plist
      properties:
        CFBundleDisplayName: East Market
        CFBundleShortVersionString: "1.0"
        # TestFlight refuses a build number it has seen before, so CI passes
        # the run number. Locally it is just 1; nothing is uploaded from there.
        CFBundleVersion: "${BUILD_NUMBER}"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: East Market needs your photos so you can add pictures to a listing.
        NSCameraUsageDescription: East Market uses the camera so you can photograph what you are selling.
        # The backend runs over plain HTTP on your own network during
        # development. Release builds should point at an https:// API and this
        # exception can then be deleted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # setup.sh passes these in; you can also paste literals here.
        # A real iPhone needs the Mac's Wi-Fi IP, not localhost.
        API_BASE_URL: ${API_BASE_URL}
        # Where a password-reset email should land. The phone's browser
        # cannot hand a session back to this app, so the new password is
        # set on the website and the person returns here to sign in.
        WEB_BASE_URL: https://east-market-web.vercel.app
        SUPABASE_URL: https://ikfozizfgiemwuokoczf.supabase.co
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eastmarket.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
